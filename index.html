<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: una columna de teléfono. Arriba el saldo del mes como una libreta de cuentas; abajo, cuatro pestañas y un botón para anotar. */
:root{
  --bg:#fbf1f4; --surface:#ffffff; --soft:#f7e3ea; --line:#ecd3dc;
  --ink:#2c1420; --muted:#775a67; --accent:#ad1f62; --accent-ink:#ffffff; --hero:#7e1548; --hero-ink:#fff4f8; --hero-muted:#f1c6d8;
  --good:#16704b; --warn:#a85a00; --bad:#bb1f33; --warn-soft:#fbecd8; --scrim:rgba(44,20,32,.45);
  --display:"Gloock",Georgia,"Times New Roman",serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b0f15; --surface:#28171f; --soft:#35202a; --line:#472d39;
  --ink:#fbeef3; --muted:#c3a6b2; --accent:#f06ba6; --accent-ink:#2a0d1b; --hero:#5e1037; --hero-ink:#fff4f8; --hero-muted:#e9b7cc;
  --good:#5fd09c; --warn:#f0b35c; --bad:#ff8592; --warn-soft:#3b2a16; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b0f15; --surface:#28171f; --soft:#35202a; --line:#472d39;
  --ink:#fbeef3; --muted:#c3a6b2; --accent:#f06ba6; --accent-ink:#2a0d1b; --hero:#5e1037; --hero-ink:#fff4f8; --hero-muted:#e9b7cc;
  --good:#5fd09c; --warn:#f0b35c; --bad:#ff8592; --warn-soft:#3b2a16; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 150px;display:grid;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:400 1.45rem/1.1 var(--display);color:var(--accent)}
.lang{display:flex;gap:2px;background:var(--soft);padding:3px;border-radius:999px}
.lang button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:14px 18px 20px}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month strong{font-weight:600;font-size:1rem}
.month button{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:var(--hero-ink);font-size:1.3rem;line-height:1}
.month button:disabled{opacity:.35;cursor:default}
.hero small{display:block;color:var(--hero-muted);font-size:.86rem;margin-top:12px}
.left{font:400 clamp(2.7rem,14vw,3.5rem)/1.08 var(--display);overflow-wrap:anywhere}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.flow span{display:block;color:var(--hero-muted);font-size:.8rem}
.flow b{font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.note{background:var(--warn-soft);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.linkbtn{justify-self:start;border:0;background:none;padding:6px 0;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
h2{font:400 1.3rem/1.2 var(--display);margin:0 0 10px;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.empty{color:var(--muted);margin:0}
.chart{display:grid;gap:12px}
.bar-top{display:flex;justify-content:space-between;gap:12px;font-size:.93rem;margin-bottom:5px}
.bar-top span:first-child{min-width:0;overflow-wrap:anywhere}
.bar-top b{font-weight:600;white-space:nowrap}
.track{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.row{width:100%;background:none;border:0;padding:11px 0;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:54px}
.row>span:first-child{min-width:0}
.row b{display:block;font-weight:600;overflow-wrap:anywhere}
.row small{color:var(--muted);font-size:.82rem}
.amt{font-weight:600;white-space:nowrap}
.amt.in{color:var(--good)}
.day{font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.day:first-child{margin-top:0}
.budget{width:100%;background:none;border:0;text-align:left;padding:13px 0;display:block}
.status{display:block;font-size:.83rem;color:var(--muted);margin-top:5px}
.status.warn{color:var(--warn);font-weight:600}.status.bad{color:var(--bad);font-weight:600}
.ghost{width:100%;min-height:48px;margin-top:8px;border:1.5px dashed var(--line);background:none;border-radius:13px;font-weight:600;color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:none;border-radius:11px;min-height:46px;font-size:.84rem;font-weight:600;color:var(--muted);padding:0 2px}
.tabs button[aria-current="page"]{background:var(--soft);color:var(--accent)}
.add{position:fixed;z-index:6;right:max(16px,calc((100vw - 528px)/2),env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 22px;box-shadow:0 8px 22px rgba(70,10,40,.32)}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(100%,560px);max-width:100%;max-height:92dvh;margin:auto auto 0;border-radius:22px 22px 0 0}
dialog::backdrop{background:var(--scrim)}
dialog form{padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:13px}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-top h2{margin:0}
.close{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:1.2rem}
label{display:grid;gap:5px;font-size:.87rem;font-weight:600;min-width:0}
.flabel{display:block;font-size:.87rem;font-weight:600;margin-bottom:5px}
input,select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-size:16px;font-weight:400;min-width:0}
input.big{font:400 1.7rem var(--display)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);padding:4px;border-radius:13px}
.seg button{border:0;background:none;min-height:42px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.err{color:var(--bad);font-size:.88rem;font-weight:600;margin:0;min-height:1.2em}
.save{min-height:50px;border:0;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.danger{min-height:46px;border:1px solid var(--bad);background:none;border-radius:13px;color:var(--bad);font-weight:600}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:600}
.pay{display:flex;align-items:center;gap:10px}
.pay .row{flex:1;min-width:0}
.due{display:block}.due.warn{color:var(--warn);font-weight:600}.due.bad{color:var(--bad);font-weight:600}.due.ok{color:var(--good)}
.paybtn{flex:none;min-height:40px;min-width:84px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;padding:0 14px}
.paybtn.undo{background:var(--soft);color:var(--accent)}
.hint{color:var(--muted);font-size:.86rem;margin:-6px 0 6px}
.sum{display:flex;justify-content:space-between;gap:12px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:.92rem}
.sum span{color:var(--muted)}
.notif{display:grid;gap:10px}.notif h2,.notif p{margin:0}.notif .ghost{margin-top:0}
.ghost.small{min-height:44px}
.nmsg{font-weight:600;color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grp+.grp{border-top:1px solid var(--line)}
.grp-head{width:100%;background:none;border:0;padding:12px 0;text-align:left;display:flex;align-items:center;gap:12px;min-height:58px}
.grp-head>span:first-child{flex:1;min-width:0}.grp-head b{display:block;font-weight:600;overflow-wrap:anywhere}.grp-head small{color:var(--muted);font-size:.82rem}
.grp-tot{font-weight:600;white-space:nowrap}.grp-tot.warn{color:var(--warn)}
.chev{font-size:1.4rem;line-height:1;color:var(--muted);transition:transform .15s}.grp.open .chev{transform:rotate(90deg)}
.list.sub{margin:0 0 8px;padding-left:12px;border-left:3px solid var(--soft)}
.stack{display:grid;gap:13px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .25s}}
</style>

<main class="wrap">
  <header class="top">
    <div class="brand">Mi Dinero</div>
    <div class="lang"><button type="button" data-lang="es" id="l-es">ES</button><button type="button" data-lang="en" id="l-en">EN</button></div>
  </header>
  <div id="storage-warn" class="warnbar" hidden></div>
  <section class="hero" id="hero">
    <div class="month">
      <button type="button" id="prev">‹</button><strong id="month-name"></strong><button type="button" id="next">›</button>
    </div>
    <small id="left-label"></small>
    <div class="left" id="left"></div>
    <div class="flow">
      <div><span id="in-label"></span><b id="in-val"></b></div>
      <div><span id="out-label"></span><b id="out-val"></b></div>
    </div>
  </section>
  <div id="view" style="display:grid;gap:18px"></div>
</main>

<button type="button" class="add" id="add"></button>
<nav class="tabs"><div>
  <button type="button" data-tab="home"></button>
  <button type="button" data-tab="moves"></button>
  <button type="button" data-tab="pays"></button>
  <button type="button" data-tab="budget"></button>
</div></nav>

<dialog id="move-dlg"><form id="move-form" novalidate>
  <div class="dlg-top"><h2 id="move-title"></h2><button type="button" class="close" data-close id="move-close">×</button></div>
  <div class="seg" id="kind"><button type="button" data-kind="out" id="k-out"></button><button type="button" data-kind="in" id="k-in"></button></div>
  <label><span id="f-amount-l"></span><input class="big" id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
  <div id="f-cat-w" class="stack"><label><span id="f-grp-l"></span><select id="f-grp"></select></label><label><span id="f-cat-l"></span><select id="f-cat"></select></label></div>
  <label><span id="f-note-l"></span><input id="f-note" maxlength="60" autocomplete="off"></label>
  <label><span id="f-date-l"></span><input id="f-date" type="date"></label>
  <p class="err" id="move-err" role="alert"></p>
  <button class="save" type="submit" id="move-save"></button>
  <button type="button" class="danger" id="move-del" hidden></button>
</form></dialog>

<dialog id="cat-dlg"><form id="cat-form" novalidate>
  <div class="dlg-top"><h2 id="cat-title"></h2><button type="button" class="close" data-close id="cat-close">×</button></div>
  <label><span id="c-name-l"></span><input id="c-name" maxlength="30" autocomplete="off"></label>
  <label><span id="c-grp-l"></span><select id="c-grp"></select></label>
  <label><span id="c-limit-l"></span><input id="c-limit" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
  <p class="err" id="cat-err" role="alert"></p>
  <button class="save" type="submit" id="cat-save"></button>
  <button type="button" class="danger" id="cat-del" hidden></button>
</form></dialog>

<dialog id="bill-dlg"><form id="bill-form" novalidate>
  <div class="dlg-top"><h2 id="bill-title"></h2><button type="button" class="close" data-close id="bill-close">×</button></div>
  <label><span id="b-name-l"></span><input id="b-name" maxlength="40" autocomplete="off"></label>
  <label><span id="b-amount-l"></span><input class="big" id="b-amount" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
  <div><span class="flabel" id="b-kind-l"></span><div class="seg"><button type="button" data-bk="bill" id="bk-bill"></button><button type="button" data-bk="sub" id="bk-sub"></button></div></div>
  <div><span class="flabel" id="b-freq-l"></span><div class="seg"><button type="button" data-bf="month" id="bf-month"></button><button type="button" data-bf="year" id="bf-year"></button></div></div>
  <div class="grid2">
    <label><span id="b-day-l"></span><select id="b-day"></select></label>
    <label id="b-month-w"><span id="b-month-l"></span><select id="b-month"></select></label>
  </div>
  <label><span id="b-remind-l"></span><select id="b-remind"></select></label>
  <p class="flabel" id="b-cat-l" style="margin:0"></p>
  <div class="stack"><label><span id="b-grp-l"></span><select id="b-grp"></select></label><label><span id="b-cat-l2"></span><select id="b-cat"></select></label></div>
  <p class="err" id="bill-err" role="alert"></p>
  <button class="save" type="submit" id="bill-save"></button>
  <button type="button" class="danger" id="bill-del" hidden></button>
</form></dialog>

  function openMove(id){
    var L=t(),m=id?state.moves.filter(function(x){return x.id===id})[0]:null;editId=m?m.id:null;
    $('move-title').textContent=m?L.editMove:L.newMove;$('k-out').textContent=L.outK;$('k-in').textContent=L.inK;$('f-amount-l').textContent=L.amount;$('f-cat-l').textContent=L.cat;$('f-note-l').textContent=L.note;$('f-date-l').textContent=L.date;$('move-save').textContent=L.save;$('move-err').textContent='';$('move-close').setAttribute('aria-label',L.close);
    $('f-grp-l').textContent=L.grp;pickCat('f-grp','f-cat',m&&m.cat,lastGroup);
    setKind(m?m.kind:'out');$('f-amount').value=m?plain(m.cents):'';$('f-note').value=m?noteOf(m):'';
    var isThis=mkey()===todayIso().slice(0,7);$('f-date').value=m?m.date:(isThis?todayIso():mkey()+'-01');
    var del=$('move-del');del.hidden=!m;del.textContent=L.del;del.dataset.armed='';
    $('move-dlg').showModal();
  }
  function openCat(id){
    var L=t(),c=id?catBy(id):null;editCat=c?c.id:null;
    $('cat-title').textContent=c?L.editCat:L.newCatT;$('c-name-l').textContent=L.catName;$('c-limit-l').textContent=L.limit;$('cat-save').textContent=L.save;$('cat-err').textContent='';$('cat-close').setAttribute('aria-label',L.close);
    $('c-name').value=c?catName(c):'';$('c-limit').value=c?plain(c.limit):'';
    $('c-grp-l').textContent=L.grp;$('c-grp').innerHTML=grpOptions();$('c-grp').value=c?groupOf(c):(lastGroup||'personal');
    var del=$('cat-del');del.hidden=!c||c.id==='otros';del.textContent=L.del;del.dataset.armed='';
    $('cat-dlg').showModal();
  }
  function setBillKind(k){billKind=k;$('bk-bill').setAttribute('aria-pressed',k==='bill');$('bk-sub').setAttribute('aria-pressed',k==='sub')}
  function setFreq(f){billFreq=f;$('bf-month').setAttribute('aria-pressed',f==='month');$('bf-year').setAttribute('aria-pressed',f==='year');$('b-month-w').hidden=f!=='year'}
  function openBill(id,g){
    var L=t(),b=id?state.bills.filter(function(x){return x.id===id})[0]:null;editBill=b?b.id:null;g=b?b.group:(g||'bill');
    $('bill-title').textContent=b?L.editPay:(g==='sub'?L.newSub:L.newBill);$('bill-close').setAttribute('aria-label',L.close);
    $('b-name-l').textContent=L.catName;$('b-amount-l').textContent=L.amount;$('b-kind-l').textContent=L.kindL;$('bk-bill').textContent=L.bill;$('bk-sub').textContent=L.sub;
    $('b-freq-l').textContent=L.freq;$('bf-month').textContent=L.monthly;$('bf-year').textContent=L.yearly;$('b-day-l').textContent=L.dueDay;$('b-month-l').textContent=L.dueMonth;
    $('b-remind-l').textContent=L.remind;$('b-cat-l').textContent=L.payCat;$('bill-save').textContent=L.save;$('bill-err').textContent='';
    $('b-name').placeholder=g==='sub'?'Netflix':L.namePh;
    $('b-remind').innerHTML=[0,1,3,4,7].map(function(n){return '<option value="'+n+'">'+esc(n===0?L.same:n===1?L.oneBefore:n+' '+L.nBefore)+'</option>'}).join('');
    $('b-month').innerHTML=Array.from({length:12},function(_,i){var s=new Intl.DateTimeFormat(L.locale,{month:'long'}).format(new Date(2026,i,1));return '<option value="'+i+'">'+esc(s.charAt(0).toUpperCase()+s.slice(1))+'</option>'}).join('');
    $('b-day').innerHTML=Array.from({length:31},function(_,i){return '<option value="'+(i+1)+'">'+(i+1)+'</option>'}).join('');
    $('b-grp-l').textContent=L.grp;$('b-cat-l2').textContent=L.cat;
    setBillKind(g);setFreq(b?b.freq:'month');
    $('b-name').value=b?b.name:'';$('b-amount').value=b?plain(b.cents):'';
    $('b-day').value=String(b?b.day:new Date().getDate());$('b-month').value=String(b?b.month:new Date().getMonth());
    $('b-remind').value=String(b?b.remind:3);pickCat('b-grp','b-cat',b&&catBy(b.cat)?b.cat:(g==='sub'?(catBy('suscripciones')?'suscripciones':'otros'):(catBy('luz')?'luz':'otros')));
    var del=$('bill-del');del.hidden=!b;del.textContent=L.del;del.dataset.armed='';
    $('bill-dlg').showModal();
  }
  function arm(btn,run){if(btn.dataset.armed){run()}else{btn.dataset.armed='1';btn.textContent=t().sure}}

  $('move-form').addEventListener('submit',function(e){
    e.preventDefault();var L=t(),c=parseMoney($('f-amount').value),date=$('f-date').value;
    if(!c||isNaN(c)){$('move-err').textContent=L.badAmt;return}
    if(!date){$('move-err').textContent=L.badDate;return}
    var old=editId?state.moves.filter(function(m){return m.id===editId})[0]:null;
    var rec={id:editId||uid(),kind:kind,cents:c,cat:kind==='out'?$('f-cat').value:null,note:$('f-note').value.trim(),date:date};
    if(old&&old.bill){rec.bill=old.bill;rec.cycle=old.cycle}
    if(editId)state.moves=state.moves.map(function(m){return m.id===editId?rec:m});else state.moves.push(rec);
    cursor=new Date(+date.slice(0,4),+date.slice(5,7)-1,1);save();$('move-dlg').close();render();
  });
  $('move-del').addEventListener('click',function(){var b=this;arm(b,function(){var m=state.moves.filter(function(x){return x.id===editId})[0];state.moves=state.moves.filter(function(x){return x.id!==editId});save();$('move-dlg').close();render();if(m&&m.bill)syncPush()})});
  $('cat-form').addEventListener('submit',function(e){
    e.preventDefault();var L=t(),name=$('c-name').value.trim(),raw=$('c-limit').value,lim=parseMoney(raw);
    if(!name){$('cat-err').textContent=L.badName;return}
    if(raw.trim()&&(lim===null||isNaN(lim))){$('cat-err').textContent=L.badLimit;return}
    var dup=state.cats.some(function(c){return c.id!==editCat&&catName(c).toLowerCase()===name.toLowerCase()});
    if(dup){$('cat-err').textContent=L.dupName;return}
    var grp=$('c-grp').value;
    if(editCat)state.cats=state.cats.map(function(c){if(c.id!==editCat)return c;return{id:c.id,group:grp,name:name===catName(c)?c.name:name,es:c.es,en:c.en,limit:lim||0}});
    else state.cats.push({id:uid(),group:grp,name:name,limit:lim||0});
    openGroups[grp]=true;lastGroup=grp;
    save();$('cat-dlg').close();render();
  });
  $('cat-del').addEventListener('click',function(){var b=this;arm(b,function(){state.moves.forEach(function(m){if(m.cat===editCat)m.cat='otros'});state.bills.forEach(function(x){if(x.cat===editCat)x.cat='otros'});state.cats=state.cats.filter(function(c){return c.id!==editCat});save();$('cat-dlg').close();render()})});
  $('bill-form').addEventListener('submit',function(e){
    e.preventDefault();var L=t(),name=$('b-name').value.trim(),c=parseMoney($('b-amount').value),day=+$('b-day').value;
    if(!name){$('bill-err').textContent=L.badName;return}
    if(!c||isNaN(c)){$('bill-err').textContent=L.badAmt;return}
    if(!(day>=1&&day<=31)){$('bill-err').textContent=L.badDay;return}
    var old=editBill?state.bills.filter(function(x){return x.id===editBill})[0]:null;
    var rec={id:editBill||uid(),name:name,group:billKind,cents:c,freq:billFreq,day:day,month:+$('b-month').value,remind:+$('b-remind').value,cat:$('b-cat').value,since:old?old.since:todayIso()};
    if(old)state.bills=state.bills.map(function(x){return x.id===editBill?rec:x});else state.bills.push(rec);
    save();$('bill-dlg').close();render();syncPush();
  });
  $('bill-del').addEventListener('click',function(){var b=this;arm(b,function(){state.bills=state.bills.filter(function(x){return x.id!==editBill});state.moves.forEach(function(m){if(m.bill===editBill){delete m.bill;delete m.cycle}});save();$('bill-dlg').close();render();syncPush()})});
  document.addEventListener('click',function(e){
    var el=e.target.closest('button');if(!el)return;
    if(el.dataset.tab||el.dataset.tabGo){tab=el.dataset.tab||el.dataset.tabGo;nMsg='';render();window.scrollTo(0,0)}
    else if(el.dataset.lang){state.lang=el.dataset.lang;save();render();syncPush()}
    else if(el.dataset.edit)openMove(el.dataset.edit);
    else if(el.dataset.cat)openCat(el.dataset.cat);
    else if(el.dataset.grp){openGroups[el.dataset.grp]=!openGroups[el.dataset.grp];if(openGroups[el.dataset.grp])lastGroup=el.dataset.grp;render()}
    else if(el.dataset.kind)setKind(el.dataset.kind);
    else if(el.dataset.bk)setBillKind(el.dataset.bk);
    else if(el.dataset.bf)setFreq(el.dataset.bf);
    else if(el.dataset.bill)openBill(el.dataset.bill);
    else if(el.dataset.newBill)openBill(null,el.dataset.newBill);
    else if(el.dataset.pay)payBill(el.dataset.pay);
    else if(el.dataset.undo)undoBill(el.dataset.undo);
    else if(el.hasAttribute('data-close'))el.closest('dialog').close();
    else if(el.id==='add')openMove(null);
    else if(el.id==='new-cat')openCat(null);
    else if(el.id==='n-on')enablePush();
    else if(el.id==='n-off')disablePush();
    else if(el.id==='n-test'){nMsg=t().nWait;render();syncPush('test').then(function(ok){nMsg=ok?t().nSent:t().nTestErr;render()})}
    else if(el.id==='prev'){cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()}
    else if(el.id==='next'){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()}
    else if(el.id==='clear-ex'){state.moves=state.moves.filter(function(m){return !m.ex});save();render()}
  });
  [['f-grp','f-cat'],['b-grp','b-cat']].forEach(function(p){$(p[0]).addEventListener('change',function(){$(p[1]).innerHTML=catOptions(this.value);lastGroup=this.value})});
  document.querySelectorAll('dialog').forEach(function(d){d.addEventListener('click',function(e){if(e.target===d)d.close()})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
  save();render();syncPush();
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}</script>
</body>
